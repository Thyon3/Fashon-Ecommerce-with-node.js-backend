name: frontend
description: "Fashon E-commerce Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP & Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  
  # Firebase & Notifications
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.3
  
  # Device & System Info
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  
  # Location & Camera
  geolocator: ^10.1.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  
  # Security & Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  
  # Additional Utilities
  crypto: ^3.0.6
  logger: ^2.4.0

  # Local Storage & Cache
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.5
  get_it: ^8.0.3
  injectable: ^2.4.4

  # UI Components & Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  flutter_svg: ^2.0.17

  # Forms & Validation
  form_field_validator: ^2.1.1

  # Image Handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Date & Time
  intl: ^0.19.0

  # Logging
  logger: ^2.4.0

  # Security
  crypto: ^3.0.6

  # JSON Annotation
  json_annotation: ^4.9.0

  # Testing & Debugging
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.4.4
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Linting & Formatting
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  golden_toolkit: ^0.15.0

  # Performance
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  # Generate localization files
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  # Custom Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon_adaptive.png"

# Flutter Native Splash Configuration
flutter_native_splash:
  color: "#667eea"
  image: assets/icons/splash_icon.png
  android: true
  ios: true
  web: true

# Injectable Configuration
injectable_generator:
  auto_register: true
